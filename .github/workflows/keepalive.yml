name: Render Keepalive

on:
  schedule:
    # Runs every 14 minutes from 01:30 to 18:30 UTC (07:00 AM to 12:00 AM IST)
    # Pauses during the night (12:00 AM to 07:00 AM IST) to conserve Render free hours
    - cron: '*/14 2-18 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -sS -m 20 https://eduvault-fma8.onrender.com/health || true
