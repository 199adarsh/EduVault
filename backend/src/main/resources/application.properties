# Server Configuration
server.port=8081

# Supabase / DB Connection Settings (defaults to local H2)
spring.datasource.url=${SUPABASE_JDBC_URL:jdbc:h2:file:./data/eduvault;AUTO_SERVER=TRUE;INIT=CREATE DOMAIN IF NOT EXISTS jsonb AS json}
spring.datasource.username=${SUPABASE_DB_USER:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
spring.jpa.show-sql=false


# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging Configuration
spring.output.ansi.enabled=ALWAYS
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR

# Application Configuration
spring.application.name=eduvault-backend
app.storage.local-dir=./data
app.gemini.base-url=${GEMINI_BASE_URL:http://localhost:8000/v1}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
