# Server Configuration
server.port=8081

# Supabase / DB Connection Settings
spring.datasource.url=${SUPABASE_JDBC_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}


# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Application Configuration
spring.application.name=eduvault-backend
app.storage.local-dir=./data

# Groq AI Configuration
app.groq.api-key=${GROQ_API_KEY:}

# Backblaze B2 Storage Configuration
app.b2.access-key-id=${B2_ACCESS_KEY_ID:}
app.b2.secret-access-key=${B2_SECRET_ACCESS_KEY:}
app.b2.endpoint=${B2_ENDPOINT:s3.us-east-005.backblazeb2.com}
app.b2.region=${B2_REGION:us-east-005}
app.b2.bucket-name=${B2_BUCKET_NAME:eduvault}
