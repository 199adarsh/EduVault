# Server Configuration
server.port=${PORT:8080}

# Supabase / DB Connection Settings (defaults to Neon PostgreSQL)
spring.datasource.url=${NEON_JDBC_URL:${DATABASE_JDBC_URL:${SUPABASE_JDBC_URL:jdbc:postgresql://ep-raspy-cell-a1e1shtq-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require}}}
spring.datasource.username=${NEON_DB_USER:${SUPABASE_DB_USER:neondb_owner}}
spring.datasource.password=${NEON_DB_PASSWORD:${SUPABASE_DB_PASSWORD:npg_0G8csDpdReyC}}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.jpa.show-sql=false

# CORS Configuration
spring.web.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging Configuration
spring.output.ansi.enabled=ALWAYS
spring.jpa.open-in-view=false
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR

# Application Configuration
spring.application.name=eduvault-backend
app.storage.local-dir=./data
app.gemini.base-url=${GEMINI_BASE_URL:http://localhost:8000/v1}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
app.brabble.api-key=${BRABBLE_API_KEY:}
app.brabble.base-url=${BRABBLE_BASE_URL:https://brabble.ai/api}
app.b2.nc-bucket-name=${B2_NC_BUCKET_NAME:eduvault-nc-proofs}
