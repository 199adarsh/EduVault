# Server Configuration
server.port=8081

# Firebase Configuration
firebase.database.url=https://your-firebase-project.firebaseio.com
firebase.service.account.file.path=classpath:firebase-service-account.json

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Application Configuration
spring.application.name=eduvault-backend
app.storage.local-dir=./data
