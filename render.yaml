services:
  - type: web
    name: eduvault
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NEON_JDBC_URL
        sync: false
      - key: NEON_DB_USER
        sync: false
      - key: NEON_DB_PASSWORD
        sync: false
      - key: B2_ACCESS_KEY_ID
        sync: false
      - key: B2_SECRET_ACCESS_KEY
        sync: false
      - key: B2_ENDPOINT
        value: s3.ca-east-006.backblazeb2.com
      - key: B2_BUCKET_NAME
        value: eduvault-storage-a8f3
      - key: B2_REGION
        value: ca-east-006
      - key: DDL_AUTO
        value: update
